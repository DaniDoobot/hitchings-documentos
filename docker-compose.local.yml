# =============================================================
# HITCHINGS Documentos — docker-compose LOCAL (smoke test)
# =============================================================
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#   python scripts/smoke_docker_local.py
#   docker compose -f docker-compose.local.yml down
#
# Expone el frontend SOLO en 127.0.0.1:8080 (no public).
# El backend NO se expone al host (igual que en producción).
# =============================================================

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - hitchings-net
    environment:
      POSTGRES_DB: hitchings_docs
      POSTGRES_USER: hitchings_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_secret_123}
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitchings_app -d hitchings_docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - hitchings-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://hitchings_app:${POSTGRES_PASSWORD:-local_dev_secret_123}@postgres:5432/hitchings_docs
      SESSION_COOKIE_SECURE: "false"
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-local_dev_secret_key_at_least_32_chars_long!}
      LOG_LEVEL: INFO
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dummy-key-for-smoke-test}
      GEMINI_TRANSCRIPTION_MODEL: gemini-3.5-transcribe
      GEMINI_ANALYSIS_MODEL: gemini-3.8-flash
      GEMINI_ANALYSIS_THINKING_LEVEL: medium
      GEMINI_TIMEOUT_SECONDS: "300"
      GEMINI_MAX_RETRIES: "2"
      MAX_DOCUMENT_SIZE_MB: "25"
      MAX_AUDIO_SIZE_MB: "200"
      MAX_TEXT_CHARACTERS: "5000000"
      MAX_ANALYSIS_INPUT_TOKENS: "900000"
      MAX_EXPORT_CHARACTERS: "2000000"
      CORS_ALLOWED_ORIGINS: ""
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - hitchings-net
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Solo localhost — nunca exponer en 0.0.0.0 en local
      - "127.0.0.1:8080:80"

networks:
  hitchings-net:
    driver: bridge

volumes:
  postgres_data_local:

