user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # No exponer versión de Nginx
    server_tokens  off;

    # Compresión gzip para assets estáticos
    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  256;
    gzip_types       text/plain text/css application/javascript application/json
                     application/xml image/svg+xml font/woff font/woff2;

    # Tamaño máximo de cuerpo para subida de audio (200 MB + margen)
    client_max_body_size  210m;

    server {
        listen  80;
        root    /usr/share/nginx/html;
        index   index.html;

        # ----------------------------------------------------------------
        # Cabeceras de seguridad globales
        # ----------------------------------------------------------------
        add_header  X-Content-Type-Options  "nosniff"           always;
        add_header  X-Frame-Options         "DENY"              always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header  Permissions-Policy      "camera=(), microphone=(), geolocation=()"  always;
        add_header  Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data:; "
            "font-src 'self'; "
            "connect-src 'self'; "
            "object-src 'none'; "
            "base-uri 'self'; "
            "form-action 'self';"
            always;

        # ----------------------------------------------------------------
        # /healthz — sin autenticación, respuesta mínima
        # ----------------------------------------------------------------
        location = /healthz {
            auth_basic  off;
            access_log  off;
            add_header  Content-Type  text/plain;
            return  200  "ok";
        }

        # ----------------------------------------------------------------
        # /api/ — proxy al backend FastAPI (red interna Docker)
        # ----------------------------------------------------------------
        location /api/ {
            auth_basic            "HITCHINGS";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            proxy_pass              http://backend:8000/api/;
            proxy_http_version      1.1;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;

            # Sin buffering para uploads y streams
            proxy_request_buffering    off;
            proxy_buffering            off;

            # Timeouts generosos para análisis Gemini (≥ 300 s)
            proxy_connect_timeout      30s;
            proxy_send_timeout         360s;
            proxy_read_timeout         360s;
        }

        # ----------------------------------------------------------------
        # / — SPA React con Basic Auth
        # ----------------------------------------------------------------
        location / {
            auth_basic            "HITCHINGS";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            try_files  $uri  $uri/  /index.html;

            # index.html no debe cachearse (siempre fresco)
            location = /index.html {
                add_header  Cache-Control  "no-cache, no-store, must-revalidate"  always;
                add_header  Pragma         "no-cache"                             always;
                add_header  Expires        "0"                                    always;
                # Mantener cabeceras de seguridad también aquí
                add_header  X-Content-Type-Options  "nosniff"  always;
                add_header  X-Frame-Options         "DENY"     always;
                add_header  Referrer-Policy         "strict-origin-when-cross-origin"  always;
            }
        }

        # Assets Vite con hash en el nombre → caché permanente
        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
            auth_basic            "HITCHINGS";
            auth_basic_user_file  /etc/nginx/.htpasswd;

            expires               1y;
            add_header            Cache-Control  "public, max-age=31536000, immutable"  always;
            add_header            X-Content-Type-Options  "nosniff"                     always;
            try_files             $uri  =404;
        }
    }
}
