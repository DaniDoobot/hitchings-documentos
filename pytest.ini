[pytest]
testpaths = tests
filterwarnings =
    # 1. Starlette 1.6: Advertencia específica emitida por Starlette/FastAPI al inicializar TestClient usando httpx
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning:starlette\.testclient
    # 2. Starlette 1.6 / AnyIO 4.15: Advertencia específica emitida internamente en starlette.testclient al referenciar anyio.abc.BlockingPortal
    ignore:.*The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\.testclient
    # 3. Google GenAI / Python 3.14: Advertencia interna sobre _UnionGenericAlias en google.genai.types
    ignore:.*_UnionGenericAlias.*is deprecated.*:DeprecationWarning:google\.genai\.types
