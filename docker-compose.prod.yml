# =============================================================
# HITCHINGS Documentos — docker-compose PRODUCCIÓN
# =============================================================
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Variables requeridas en el entorno del host (o via --env-file):
#   Ver .env.production.example
# =============================================================

services:

  # ----------------------------------------------------------
  # Database — PostgreSQL 16 (solo red interna, volumen persistente)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - hitchings-docs-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hitchings_docs}
      POSTGRES_USER: ${POSTGRES_USER:-hitchings_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hitchings_app} -d $${POSTGRES_DB:-hitchings_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # Backend — FastAPI (solo red interna, NO publicado al host)
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      hitchings-docs-net:
        aliases:
          - docs-backend
          - backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-hitchings_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hitchings_docs}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-3.5-transcribe}
      GEMINI_ANALYSIS_MODEL: ${GEMINI_ANALYSIS_MODEL:-gemini-3.8-flash}
      GEMINI_ANALYSIS_THINKING_LEVEL: ${GEMINI_ANALYSIS_THINKING_LEVEL:-medium}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-300}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-25}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-200}
      MAX_TEXT_CHARACTERS: ${MAX_TEXT_CHARACTERS:-5000000}
      MAX_ANALYSIS_INPUT_TOKENS: ${MAX_ANALYSIS_INPUT_TOKENS:-900000}
      MAX_EXPORT_CHARACTERS: ${MAX_EXPORT_CHARACTERS:-2000000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # Frontend — Nginx + React SPA
  # Único servicio expuesto al exterior (vía Traefik en prod)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - hitchings-docs-net
    depends_on:
      backend:
        condition: service_healthy
    # En producción Traefik/Dokploy gestiona el puerto externo.
    # NO se publican puertos aquí; Dokploy los asigna via labels.

networks:
  hitchings-docs-net:
    driver: bridge

volumes:
  postgres_data:


